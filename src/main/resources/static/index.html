<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIS Stock Backend</title>
    <style>
      body {font-family: Inter, system-ui, sans-serif; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f5f7fb; color: #1f2937;}
      .card {background: white; border-radius: 16px; box-shadow: 0 14px 40px rgba(15, 23, 42, 0.12); padding: 32px; max-width: 520px; width: 100%;}
      a {color: #2563eb; text-decoration: none;}
      a:hover {text-decoration: underline;}
      p {margin: 0.75rem 0;}

  </head>
  <body>
    <section class="card">
      <h1>AIS Stock backend</h1>
      <p>Сервер работает. API доступны по пути <code>/api/*</code>.</p>
      <p>Фронтенд пока запускается отдельно: <a href="http://localhost:5173" target="_blank">http://localhost:5173</a></p>

    </section>

</html>
